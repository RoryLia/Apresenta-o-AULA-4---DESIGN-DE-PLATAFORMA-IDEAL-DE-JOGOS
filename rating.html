<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Avaliação de Jogos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="header"></div>
  <main>
    <h2>Avalie nossos jogos!</h2>
    <form id="ratingForm">
      <label for="jogo">Jogo:</label>
      <select id="jogo"></select>
      <label for="nota">Nota (1 a 5):</label>
      <input type="number" id="nota" name="nota" min="1" max="5" required>
      <button type="submit">Enviar Avaliação</button>
    </form>
    <div id="ratings-list"></div>
  </main>
  <div id="footer"></div>
  <script>
    fetch('header.html').then(res => res.text()).then(data => document.getElementById('header').innerHTML = data);
    fetch('footer.html').then(res => res.text()).then(data => document.getElementById('footer').innerHTML = data);
  </script>
  <!-- Adicione JS de avaliação conforme desejar -->
</body>
</html>
